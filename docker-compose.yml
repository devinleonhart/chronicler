services:
  web:
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    environment:
      DEVELOPMENT_DATABASE_URL: postgresql://postgres:postgres@db:5432/chronicler_dev
      TEST_DATABASE_URL: postgresql://postgres:postgres@db-test:5432/chronicler_test
    volumes:
      - .:/app
    ports:
      - "3000:3000"

  db:
    image: postgres:18.7
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chronicler_dev
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck: &postgres_health
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:18.7
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chronicler_test
    healthcheck: *postgres_health

volumes:
  db_data:
